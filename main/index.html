<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="utf=8">
        <meta name="viewport" content="width=device-width,initial.scale=1.0">
        <title>projectZero.de</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header id="indexHeader">
            <div id="headerContentShell" style="width:100%; height:100%;">
                <h1><span id="headerTitle"></span></h1>
                <div id="headerContent"></div>
            </div>
        </header>
        <main id="indexMain">
            <div id="dashboardShell">
                <div id="dashboard">
                    <h2>DASHBOARD</h2>
                    <p>USER: <span id="dashUser"></span></p>
                    <p>ID: <span id="dashId"></span></p>
                    <p>CREDITS: <span id="dashCredits"></span></p>
                    <p>CORRECT ANSWERS: <span id="dashCorrect"></span></p>
                    <p>WRONG ANSWERS: <span id="dashWrong"></span></p>
                    <p>HIGHSCORE: <span id="dashScore"></span></p>
                    <p>JOIN-DATE: <span id="dashJoin"></span></p>
                    <p>DEV-SHI: <span id="devShi">BRUH</span></p>
                </div>
            </div>
            <div id="toolMenuShell">
                <div id="toolMenu">
                    <details class="toolMenuDetails">
                    <summary >TRAINGROUND</summary>
                        <button id="runCstmLvl">CUSTOM LEVELS</button>
                    </details>
                    <details class="toolMenuDetails">
                    <summary>LESSONS</summary>
                        <button id="runHtmlBtn">HTML</button>
                    </details>
                </div>
            </div>
            <div id="toolAreaShell">
                <div id="toolAreaUi">
                    <div id="toolFrame" style="width:100%; height:100%;"></div>
                </div>
            </div>
        </main>
        <footer id="indexFooter">
            <div id="devPhoneShell">
                <div id="devPhoneFrame">
                    <h3>DEV-PHONE</h3>
                    <div id="devPhone"> <!--MUSS DEV PHONE HOME UPDATEN BEI ÄNDERUNGEN-->
                        <div id="devPhoneTopbar">
                            <p><span id="clock">CLOCK</span></p>
                        </div>
                        <div id="trainyardEditor" class="phoneApp">
                            <img src="C:\Users\extra\Desktop\Programming\Images\drive-download-20260712T180211Z-2-001\5.jpg"><br>
                            <button onclick="yardEditor()">Trainyard Editor</button>
                        </div>
                        <div id="trainyardEditor" class="phoneApp">
                            <img src="C:\Users\extra\Desktop\Programming\Images\drive-download-20260712T180211Z-2-001\24.gif"><br>
                            <button onclick="loadNotes()">NotesValpha</button>
                        </div>
                        <button onclick="homeButton()" style="
                            color: white;
    background: black;
    border-radius: 50%;
    width: 5vw;
    position: absolute;
    bottom: -38px;
    right: 42%;
    height: 10vh;
                        ">HOME</button>
                    </div>
                </div>
            </div>
        </footer>
        <script src="js/devPhone.js"></script>
        <script src="js/data.js"></script>
        <script src="js/script.js"></script>
        <script>
            if(sessionStorage.getItem("activeUser") === null){
                window.location.href = "loginYard.html";
            }
            const activeDude = JSON.parse(sessionStorage.getItem("activeUser"));
            if(activeDude.username === "EatSumCrips"){
                activeDude.username = "EatSumCrips [DEV]";
                devMode = true;
                phoneShell.style.display = "flex";
            }else{
                devMode = false;
                phoneShell.style.display = "none";
            }
            document.getElementById("dashUser").innerText = activeDude.username;
            document.getElementById("dashId").innerText = activeDude.userId;
            document.getElementById("dashCredits").innerText = activeDude.credits;
            document.getElementById("dashCorrect").innerText = activeDude.trueScore;
            document.getElementById("dashWrong").innerText = activeDude.falseScore;
            document.getElementById("dashScore").innerText = activeDude.highscore;
            document.getElementById("dashJoin").innerText = activeDude.joinDate;

            setInterval(() => {
                updateClock();
            }, 100);

            function updateClock(){
                const now = new Date();
                const hours = String(now.getHours()).padStart(2,"0");
                const minutes = String(now.getMinutes()).padStart(2, "0");
                const seconds = String(now.getSeconds()).padStart(2, "0");
                document.getElementById("clock").innerText = `${hours}:${minutes}:${seconds}`;
            }
        </script>
    </body>
</html>
